		<script>

						var language = localStorage.getItem('waStoretranslate.language') || 'ua';
						var base = root.getAttribute('data-startup-language');
						show = !!language && !!base && language !== base;
					} catch (e) {}
				}

					root.classList.add('wstartup-pending');
