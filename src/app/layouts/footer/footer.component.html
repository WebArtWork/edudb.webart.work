<footer class="site-footer">
	<div class="site-footer-inner">
		<div>
			<a
				class="wordmark theme-focus"
				routerLink="/"
				aria-label="Go to the home page"
				[translate]="{ ariaLabel: 'Go to the home page' }"
			>
				<img src="logo.png" width="36" height="36" alt="" loading="lazy" />
				<span>EduDB</span>
			</a>
			<p class="mt-3 max-w-[44ch] text-sm leading-relaxed" [translate]="company.description">
				{{ company.description }}
			</p>
		</div>
		<nav aria-label="Footer pages" [translate]="{ ariaLabel: 'Footer pages' }">
			<ul class="flex flex-wrap gap-x-5 gap-y-3">
				@for (page of pageLinks(); track page.path) {
					<li>
						<a
							class="theme-focus text-sm font-semibold hover:underline"
							[routerLink]="page.path"
							[translate]="page.label"
							>{{ page.label }}</a
						>
					</li>
				}
			</ul>
		</nav>
		<p class="site-copyright text-sm text-[var(--c-text-muted)]">
			&copy; {{ currentYear }} {{ company.name }}
		</p>
	</div>
</footer>
